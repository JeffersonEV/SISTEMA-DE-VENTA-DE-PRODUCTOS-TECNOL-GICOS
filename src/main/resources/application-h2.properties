# =========================================================
# Perfil H2 - demostracion local SIN PostgreSQL.
# Uso:  $env:SPRING_PROFILES_ACTIVE="h2"; .\mvnw.cmd spring-boot:run
# Base de datos en memoria: se recrea y carga datos demo al iniciar.
# =========================================================
spring.datasource.url=jdbc:h2:mem:techstore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=DevSecretKeyForH2DemoAtLeastThirtyTwoCharsLong!
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200
