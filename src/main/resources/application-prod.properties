# Perfil de produccion (Render / Railway).
# Todas las variables se leen del entorno; no se dejan secretos en el repositorio.
spring.application.name=techstore

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
