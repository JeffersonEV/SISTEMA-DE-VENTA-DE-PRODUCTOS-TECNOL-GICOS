spring.application.name=techstore

# ===================== DATASOURCE (PostgreSQL) =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_tecnologico}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== SERVIDOR =====================
server.port=${PORT:8080}

# ===================== SEGURIDAD / JWT =====================
# IMPORTANTE: en produccion definir JWT_SECRET (minimo 32 caracteres). El default es solo para desarrollo.
app.jwt.secret=${JWT_SECRET:TechStoreDevSecretKeyChangeMeInProduction_0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===================== CORS =====================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===================== OPENAPI / SWAGGER =====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
